<!-- Container sized exactly to the rendered page pixels -->
<div
    class="relative inline-block select-none shadow-lg bg-white"
    [style.width.px]="page().widthPx"
    [style.height.px]="page().heightPx">

    <!-- Rendered page image (background: 100% sharp native PDF rasterization) -->
    <img
        [src]="page().imageDataUrl"
        [attr.width]="page().widthPx"
        [attr.height]="page().heightPx"
        class="block pointer-events-none"
        alt="PDF page preview"
        draggable="false" />

    <!-- Text overlay: one span per text item, absolutely positioned -->
    @for (item of page().textItems; track trackById($index, item)) {
        @let isEditing = activeItemId() === item.id;
        @let edit = edits().get(item.id);
        @let isModified = !!edit && edit.newText !== item.text;

        <span
            #textSpan
            [attr.contenteditable]="true"
            [style]="itemStyle(item, page().scale, isEditing, isModified)"
            class="absolute overflow-hidden cursor-text outline-none select-text transition-shadow rounded-xs"
            [class.hover:ring-1]="!isEditing && !isModified"
            [class.hover:ring-sky-400/80]="!isEditing && !isModified"
            [class.hover:bg-sky-400/10]="!isEditing && !isModified"
            [class.z-20]="isEditing"
            [class.ring-2]="isEditing"
            [class.ring-sky-500]="isEditing"
            [class.shadow-md]="isEditing"
            [class.z-10]="isModified && !isEditing"
            [class.ring-1]="isModified && !isEditing"
            [class.ring-amber-500]="isModified && !isEditing"
            spellcheck="false"
            autocomplete="off"
            (focus)="onFocus(item)"
            (blur)="onBlur(item, $event)"
            (keydown)="onKeydown($event, item)">{{ isModified ? edit.newText : item.text }}</span>
    }
</div>
